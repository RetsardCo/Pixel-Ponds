<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Ponds — Cozy Farm & Fishing Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-wrapper">
        <header id="game-header">
            <h1 class="logo">🌾 Pixel Ponds 🎣</h1>
            <p class="subtitle">A Cozy 2D Farm & Fishing Adventure</p>
        </header>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>

            <div id="instructions">
                <div class="overlay-content">
                    <div class="banner-badge">✨ Welcome Adventurer</div>
                    <h2>Pixel Ponds</h2>
                    <p class="tagline">Plant crops, catch rare fish, build your cozy homestead!</p>

                    <div class="controls-grid">
                        <div class="control-card">
                            <span class="key">WASD / ⚔</span>
                            <span class="label">Move Player</span>
                        </div>
                        <div class="control-card">
                            <span class="key">1 - 4</span>
                            <span class="label">Switch Tool</span>
                        </div>
                        <div class="control-card">
                            <span class="key">Left Click</span>
                            <span class="label">Use Tool / Harvest</span>
                        </div>
                        <div class="control-card">
                            <span class="key">Right Click</span>
                            <span class="label">Reel & Fight Fish</span>
                        </div>
                        <div class="control-card">
                            <span class="key">Q / R</span>
                            <span class="label">Cycle Seeds</span>
                        </div>
                        <div class="control-card">
                            <span class="key">E</span>
                            <span class="label">Sleep / Rest</span>
                        </div>
                    </div>

                    <button id="startBtn" onclick="startGame()">
                        <span class="btn-icon">▶</span> Play Game
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Sprite Assets for Canvas Rendering -->
    <img id="img-player" src="assets/player_sprites.jpg" style="display:none">
    <img id="img-env" src="assets/environment_tiles.jpg" style="display:none">
    <img id="img-fish" src="assets/fish_sprites.jpg" style="display:none">
    <img id="img-crops" src="assets/crop_sprites.jpg" style="display:none">
    <img id="img-tools" src="assets/tool_icons.jpg" style="display:none">
    <img id="img-ui" src="assets/ui_elements.jpg" style="display:none">
    <img id="img-cover" src="assets/cover.jpg" style="display:none">
    <img id="img-tileset" src="assets/tileset.jpg" style="display:none">
    <img id="img-items" src="assets/items.jpg" style="display:none">

    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
